[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcnp-research-skill"
version = "0.4.0b1"
description = "MCNP5 research skill with natural-language workflow planning, diagnostics, GEB integration, runtime preflight, and 748 tests."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "scipy>=1.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
origin = [
    "pywin32>=306",
]
dev = [
    "pytest>=8",
]

[project.scripts]
mcnp-research = "mcnp_research_skill.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["mcnp_research_skill*"]
exclude = ["legacy*", "configs*", "tests*", "docs*"]

[tool.setuptools.package-data]
"mcnp_research_skill" = ["models/fixtures/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
