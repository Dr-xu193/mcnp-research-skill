[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcnp-research-skill"
version = "0.3.0"
description = "MCNP5 research toolkit with natural-language workflow planner, MCNP5 diagnostics, built-in detector models, and 712 tests."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "scipy>=1.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
origin = [
    "pywin32>=306",
]

[project.scripts]
mcnp-research = "mcnp_research_skill.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["mcnp_research_skill*"]
exclude = ["legacy*", "configs*", "tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
